name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn pytest
      - run: python -c "from data.synthetic_smb import generate_smb_accounts; df=generate_smb_accounts(300); assert len(df)==300; print('OK')"
